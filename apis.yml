aid: vinculum
name: Vinculum
description: >-
  Vinculum is an AI-driven SaaS company for omnichannel retail and ecommerce. Its Vin eRetail
  platform unifies order management (OMS), warehouse management (WMS), product information
  management (PIM), and endless-aisle omnichannel retail across 150+ sales channels and
  marketplaces for 1,000+ brands, processing 20M+ orders monthly. The Vin eRetail REST API
  exposes orders, returns, products/SKUs, inventory/stock, vendors, purchase orders, inbounds,
  advance shipping notices, transfers, and fulfillment operations, alongside a SellerPanel V3
  marketplace API for listing, order, and courier-allocation flows. Originally surfaced as an
  Accel portfolio company, this profile has been enriched from Vinculum's published Swagger.
