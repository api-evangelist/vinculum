      summary: Max no. of Lines/hit:100 API For Returning an Order(Hit Quota 40/5 min)
      responses:
        200:
          description: <table border='1'width='672'> <h1  style="color:#FFFF00;">API Generic Error Codes</h1><tbody><tr align="center"><td style="vertical-align:middle" width='167'><p><strong>Response Code </strong></p></td><td style="vertical-align:middle" colspan='2' width='171'><p><strong> Response Message </strong></p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>104</p></td><td style="vertical-align:middle" width='167'><p>Order Creation Error while processing</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>501</p></td><td style="vertical-align:middle" width='167'><p>No Access for given Order Location.</p></td><tr align="center"><td style="vertical-align:middle" width='167'><p>502</p></td><td style="vertical-align:middle" width='167'><p>Order Location is mandatory.</p></td><tr align="center"><td style="vertical-align:middle" width='167'><p>504</p></td><td style="vertical-align:middle" width='167'><p>Order_no is mandatory and must be unique within the request.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>701</p></td><td style="vertical-align:middle" width='167'><p>Maximum Limit Exceeded(100 SKUs Max)</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9007</p></td><td style="vertical-align:middle" width='167'><p>No Access for given Order Location</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>11001</p></td><td style="vertical-align:middle" width='167'><p>Validation related errors</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>11002</p></td><td style="vertical-align:middle" width='167'><p>Order Not Found in ERP</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>11003</p></td><td style="vertical-align:middle" width='167'><p>Invoice Number is not found in ERP</p></td></tr></tbody></table><table> <tbody> <td style="vertical-align:middle" colspan=4> <b>Case 1- For Single Return Submitted<br/>{<br/>&nbsp;&nbsp;"responseCode":0,<br/>&nbsp;&nbsp;"responseMessage":"Success",<br/>&nbsp;&nbsp;"requestStatus":{<br/>&nbsp;&nbsp;&nbsp;&nbsp;"uniqueKey":"TWH001234",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"requestKey":"TWH001234",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"outputKey":"TWH968",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"status":"Success",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"errorDesc":null,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"errorCode":null<br/>&nbsp;&nbsp;}<br/>}<br/><br/>Case 2- For Multiple Return Submitted<br/>{<br/>&nbsp;&nbsp;"responseCode":0,<br/>&nbsp;&nbsp;"responseMessage":"Success",<br/>&nbsp;&nbsp;"requestId":"02cb470eaf40466c80bdba8faedd4be5"<br/>}</b></tbody></table>
      requestBody:
