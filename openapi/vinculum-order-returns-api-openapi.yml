tyle="vertical-align:middle">Optional</td><td style="vertical-align:middle">List of channel code can be passed so that basis on channel code order and return can be pulled</td></tr><tr align="center"><td style="vertical-align:middle">returnType</td><td style="vertical-align:middle">Array</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">List of return type can be passed so that basis on return can be pulled</td></tr><tr align="center"><td style="vertical-align:middle" colspan=4 ><b>Additional Information</b></td></tr><tr align="left"><td style="vertical-align:middle" colspan=4 >Max Allowed Date Range-  7. Days. </td></tr><tr align="left"><td style="vertical-align:middle" colspan=4 >Max Allowed brands  -10.</td></tr><tr align="center"><tr><td style="vertical-align:middle" colspan=5> <b>Input JSON Format-<br/> Case 1-Get orders detail by Order No<br/>&nbsp;{<br/>&nbsp;&nbsp;&nbsp;&nbsp;"order_no":["NHW1600256"],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_no":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"customer_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"channel_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"status":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_from":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_to":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnSource":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"ret_del_loc":"CHE",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"brand":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnType":[]<br/>&nbsp;}<br/>&nbsp;Case 2- Get order return details by date filter<br/>&nbsp;{<br/>&nbsp;&nbsp;&nbsp;&nbsp;"order_no":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_no":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"customer_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"channel_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"status":["Confirmed", "Closed"],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_from":"DD/MM/YYYY HH:mm:ss",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_to":"DD/MM/YYYY HH:mm:ss",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnSource":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":"CHE",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"brand":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnType":["1","2"]<br/><br/>&nbsp;}<br/>Case 4-Get orders detail by using filterBy filter<br/>&nbsp;{<br/>&nbsp;&nbsp;&nbsp;&nbsp;"order_no":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_no":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"customer_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"channel_code":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"status":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"return_tracking_no":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"ret_del_loc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_from":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"date_to":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnSource":2,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":1,<br/>&nbsp;&nbsp;&nbsp;&nbsp;"brand":[],<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnType":["1","2","3"]<br/>&nbsp;&nbsp;&nbsp;&nbsp;}<br/>&nbsp;</b><br/></td></tr></tbody></table>
