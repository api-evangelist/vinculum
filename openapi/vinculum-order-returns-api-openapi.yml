                  description: <table class="table-style-three"><tbody><tr align="center"><td style="vertical-align:middle" width='100'><strong>Field Name </strong></td><td style="vertical-align:middle" width='100'><strong>Data Type </strong></td><td style="vertical-align:middle" width='100'><strong>Mandatory </strong></td><td style="vertical-align:middle" width='300'><strong>Description </strong></td></tr><tr align="center"><td style="vertical-align:middle" >requestType</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >requestType should be like Request or Request & Inbound</td></tr><tr align="center"><td style="vertical-align:middle" >returnType</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >returnType should be like RTO or Delivered Return</td></tr><tr align="center"><td style="vertical-align:middle" >returnBin</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Return Bin</td></tr><tr align="center"><td style="vertical-align:middle" >order_location</td><td style="vertical-align:middle" >Varchar(3)</td><td style="vertical-align:middle" >Conditional</td><td style="vertical-align:middle" >eRetail Location Code or loccode of external system. API will pick Loc Code from Order API configuration, if single Location Code is configured. If API is mapped with multiple locations, it is mandatory to provide the field in request</td></tr><tr align="center"><td style="vertical-align:middle" >order_no</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Orderno from external system</td></tr><tr align="center"><td style="vertical-align:middle" >invoice_no</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Either the invoice_no or tracking_no needed</td></tr><tr align="center"><td style="vertical-align:middle" >tracking_no</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Either the invoice_no or tracking_no needed</td></tr><tr align="center"><td style="vertical-align:middle" >status</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >&nbsp;e. g.<b> Pending, Confirmed.</b> Master Code:ODRSTS&nbsp;</td></tr><tr align="center"><td style="vertical-align:middle" >custRetCode</td><td style="vertical-align:middle" >Varchar(12)</td><td style="vertical-align:middle" >Optional*</td><td style="vertical-align:middle" >Mandatory In case of Cancellation.</td></tr><tr align="center"><td style="vertical-align:middle" >extCustRetCode</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Return Customer Code from External System</td></tr><tr align="center"><td style="vertical-align:middle" >return_date</td><td style="vertical-align:middle" >datetime</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Format given in Generic Information section</td></tr><tr align="center"><td style="vertical-align:middle" >customer_name</td><td style="vertical-align:middle" >Varchar(100)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_address1</td><td style="vertical-align:middle" >Varchar(1000)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_address2</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_address3</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_address4</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_country</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_state</td><td style="vertical-align:middle" >int(11)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_city</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" ></td></tr><tr align="center"><td style="vertical-align:middle" >customer_pincode</td><td style="vertical-align:middle" >Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >customer_email</td><td style="vertical-align:middle" >Varchar(255)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr align="center"><td style="vertical-align:middle" >remarks</td><td style="vertical-align:middle" >Varchar(5000)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed then first item 'return_reason' will be set.</td></tr><tr align="center"><td style="vertical-align:middle" >transporter</td><td style="vertical-align:middle" >int(11)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Transportercode as per masters</td></tr><tr align="center"><td style="vertical-align:middle" >category</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Define in codelkup table with lkupcode DRTYPE</td></tr><tr align="center"><td style="vertical-align:middle" >coupon</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Valid Coupon No</td></tr><tr align="center"><td style="vertical-align:middle" >udf1</td><td style="vertical-align:middle" >Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">UDF1 must NOT be greater than 2000 characters</td></tr><tr align="center"><td style="vertical-align:middle" >udf2</td><td style="vertical-align:middle" >Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle"> UDF2 must NOT be greater than 2000 characters</td></tr><tr align="center"><td style="vertical-align:middle" >udf3</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf4</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf5</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf6</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf7</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf8</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf9</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >udf10</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" >geoType</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Conditional</td><td style="vertical-align:middle" > Geocode system type (eg. What3Words).</td></tr><tr align="center"><td style="vertical-align:middle" >geoAddress</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Customer's ship to geocode address</td></tr><tr align="center"><td style="vertical-align:middle" >geoLatitude</td><td style="vertical-align:middle" >Text</td><td style="vertical-align:middle" >Conditional</td><td style="vertical-align:middle" >Geocode latitude, Geotype is mandatory for this field</td></tr><tr align="center"><td style="vertical-align:middle" >geoLongitude</td><td style="vertical-align:middle" >Text</td><td style="vertical-align:middle" >Conditional</td><td style="vertical-align:middle" >Geocode longitude, Geotype is mandatory for this field</td></tr><tr align="center"><td style="vertical-align:middle" >return_tracking_no</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" > Reverse AWB No</td></tr><tr align="center"><td style="vertical-align:middle" >transporterName</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" > If both Transcode and transporterName are present, Transcode takes priority, and the transporterName is retrieved accordingly. Otherwise, the provided value is used. </td></tr><tr align="center"><td style="vertical-align:middle" >updatedPrice</td><td style="vertical-align:middle" >decimal(10,3)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" > The default value will be set to the sum of the line-level updated prices, unless a specific value is provided in this field.</td></tr><tr align="center"><td style="vertical-align:middle" >delType</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Accepted Values are PickUp, Delivery or No PickUp, By default, the value will be set to PickUp if not provided.</td></tr><tr align="center"><td style="vertical-align:middle" >referenceNo</td><td style="vertical-align:middle" >Varchar(255)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Tracking Number (Must be unique)</td></tr><tr align="center"><td style="vertical-align:middle" >customer_altPhoneNo</td><td style="vertical-align:middle" >Varchar(20)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >If not passed will pick from order</td></tr><tr al