-align:middle">discountPercent</td><td style="vertical-align:middle" >Decima(20,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">DiscountPercent value should be between 0 and 100</td></tr><tr align="center"><td style="vertical-align:middle">isPhysicalGiftCard</td><td style="vertical-align:middle" >Optional(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible Values Yes or No</td></tr><tr align="center"><td style="vertical-align:middle">giftCardNo</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Unique identifier for the gift card associated with the order line.</td></tr><tr align="center"><td style="vertical-align:middle">giftWrapType</td><td style="vertical-align:middle" >Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Free text field specifying the type of gift wrapping.</td></tr><tr align="center"><td style="vertical-align:middle">giftMessage</td><td style="vertical-align:middle" >Varchar(5000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Personalized message for gift wrap.</td></tr><tr align="center"><td style="vertical-align:middle">pickingInstructions</td><td style="vertical-align:middle" >Array</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Maximum allowded are 10</td></tr><tr align="center"><td style="vertical-align:middle">shippingInstructions</td><td style="vertical-align:middle" >Array</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Maximum allowded are  10</td></tr><tr align="center"><td style="vertical-align:middle">orderLineTags</td><td style="vertical-align:middle" >Array</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">List of tags associated with the specific order line item.</td></tr><