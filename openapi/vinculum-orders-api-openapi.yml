elkup with lkupcode "ODRCNCLRSN"</td></tr><tr align="center"><td style="vertical-align:middle">cancelation_remarks</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Order cancellation Remarks at line level</td></tr><tr><td style="vertical-align:middle" colspan=4> <b>JSON FORMAT-<br/> <br/> {<br/> &nbsp;&nbsp;&nbsp;&nbsp;"order":{</br>&nbsp;&nbsp;&nbsp;&nbsp;"order_location":"TWH",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"uniqueKey":"300301",</br>&nbsp;&nbsp;&nbsp;&nbsp;"order_no":"300301",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"reqType":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"items":[<br/>&nbsp;&nbsp;&nbsp;&nbsp;{<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"lineno":"1",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"ext_lineno":" ",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"sku":"T04TAP0858-178",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"channel_sku_code":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"channel_product_id":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"bagId":"00000005-667556246964-1",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelled_qty":"2",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelation_reason":"Others",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelation_remarks":"Cancel this order"<br/>&nbsp;&nbsp;&nbsp;&nbsp;},<br/>&nbsp;&nbsp;&nbsp;&nbsp;{<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"lineno":"2",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"ext_lineno":" ",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"sku":"T04TAP0858-174",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"channel_product_id":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"channel_sku_code":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"bagId":"00000005-667556246934-1",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelled_qty":"2",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelation_reason":"Others",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"cancelation_remarks":"Cancel this order"<br/>&nbsp;&nbsp;&nbsp;&nbsp;}<br/>&nbsp;&nbsp;&nbsp;&nbsp;]<br/>&nbsp;&nbsp;&nbsp;}<br/>&nbsp;}<br/></b><br/><br/></tbody></table>
