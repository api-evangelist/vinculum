  /RestWS/api/eretail/v1/order/stoDetails:
    post:
      tags:
      - Transfers
      summary: Max Allowance - 20 Orders. API For Get STO Details(Hit Quota 40/5 min)
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: header
        name: ApiOwner
        required: true
        type: string
        description: API Owner.
      - in: header
        name: ApiKey
        required: true
        type: string
        description: API Key.
      - in: body
