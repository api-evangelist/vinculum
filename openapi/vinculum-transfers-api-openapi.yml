        type: string
        description: API Key.
      - in: body
        name: STOCreateJSON
        description: <table class="table-style-three"><tbody><tr align="center"><td style="vertical-align:middle" width='100'><strong>Field Name </strong></td><td style="vertical-align:middle" width='100'><strong>Data Type </strong></td><td style="vertical-align:middle" width='100'><strong>Mandatory </strong></td><td style="vertical-align:middle" width='300'><strong>Description </strong></td></tr><tr align="center"><td style="vertical-align:middle">stoNo</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory when mode is Update</td></tr><tr align="center"><td style="vertical-align:middle">mode</td><td style="vertical-align:middle">Varchar(12)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Possible values are Create and Update</td></tr><tr align="center"><td style="vertical-align:middle">stoType</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are Normal and Return, Define in Codelkup with lkupcode 'ODRTYPE'(Default Normal)</td></tr><tr align="center"><td style="vertical-align:middle">fromLocCode</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">eRetail valid loccode or loccode of external system</td></tr><tr align="center"><td style="vertical-align:middle">toLocCode</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">eRetail valid loccode or loccode of external system</td></tr><tr align="center"><td style="vertical-align:middle">reasonCode</td><td style="vertical-align:middle">Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Define in Codelkup with lkupcode 'STRSN'(Default Misc)</td></tr><tr align="center"><td style="vertical-align:middle">priority</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Define in Codelkup with lkupcode 'ORDPRT'(Default Normal)</td></tr><tr align="center"><td style="vertical-align:middle">remarks</td><td style="vertical-align:middle">Varchar(5000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Remarks against STO</td></tr><tr align="center"><td style="vertical-align:middle">status</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Define in Codelkup with lkupcode 'STRSTS'.</td></tr><tr align="center"><td style="vertical-align:middle">udf1</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf2</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf3</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf4</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf5</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">orderDate</td><td style="vertical-align:middle">datetime</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Date format (dd/MM/yyyy HH:mm:ss)</td></tr><tr align="center"><td style="vertical-align:middle" colspan="4"><b>ItemDetails Fields</b><h4>For Create Mode Only</h4></td></tr><tr align="center"><td style="vertical-align:middle">extLineNo</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Enter Line Number</td></tr><tr align="center"><td style="vertical-align:middle">skuCode</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Valid SKU linked with from & to location</td></tr><tr align="center"><td style="vertical-align:middle">qty</td><td style="vertical-align:middle">decimal(10,3)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">INTEGER/FLOAT (Depends on hasDecimal Flag)</td></tr><tr align="center"><td style="vertical-align:middle">udf1</td><td style="vertical-align:middle">Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf2</td><td style="vertical-align:middle">Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf3</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf4</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle">udf5</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User defined field</td></tr><tr align="center"><td style="vertical-align:middle" colspan=4 ><b>Additional Information</b></td></tr><tr align="left"><td style="vertical-align:middle" colspan=4 >Max Allowance - 100 orderList items at a time.</td></tr><tr><td style="vertical-align:middle" colspan=4> <b>JSON Format:&nbsp;</br>&nbsp;{</br>"orderList":[</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"XYZ123",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"mode":"Create",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"stoType":"Normal",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"fromLocCode":"NWB",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"toLocCode":"NBS",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"reasonCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; "priority":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"remarks":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"status":"Confirm",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf1":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; "udf2":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf3":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf4":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf5":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; "orderDate":"13/1/2020 12:30:00",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"itemDetails":[</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"extLineNo":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"skuCode":"STEST001",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"qty":"5",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf1":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf2":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf3":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf4":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"udf5":""</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}</br>&nbsp;&nbsp;&nbsp;&nbsp;]</br>}</br></br></tbody></table>
        schema:
          type: object
          required:
          - stoNo
          properties:
            orderList:
              type: array
              items:
                $ref: '#/definitions/STOCreate0'
      responses:
        200:
          description: <table border='1'width='672'> <h1  style="color:#FFFF00;">API Generic Error Codes</h1><tbody><tr align="center"><td style="vertical-align:middle" width='167'><p><strong>Response Code </strong></p></td><td style="vertical-align:middle" colspan='2' width='171'><p><strong> Response Message </strong></p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9205</p></td><td style="vertical-align:middle" width='167'><p>From Location is mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9206</p></td><td style="vertical-align:middle" width='167'><p>To Location is mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9207</p></td><td style="vertical-align:middle" width='167'><p>From & To Location can't be same</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9208</p></td><td style="vertical-align:middle" width='167'><p>STO No is mandatory in case of update.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9209</p></td><td style="vertical-align:middle" width='167'><p>Invalid operation mode. Please specify Create/Update.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9210</p></td><td style="vertical-align:middle" width='167'><p>Operation mode can't be blank. Please specify Create/Update</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9211</p></td><td style="vertical-align:middle" width='167'><p>Invalid status.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9212</p></td><td style="vertical-align:middle" width='167'><p>Status can't be blank.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9213</p></td><td style="vertical-align:middle" width='167'><p>Invalid STO type.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9214</p></td><td style="vertical-align:middle" width='167'><p>Invalid reason code.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9215</p></td><td style="vertical-align:middle" width='167'><p>Invalid priority value.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9216</p></td><td style="vertical-align:middle" width='167'><p>ItemDetails are mandatory for STO creation.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9217</p></td><td style="vertical-align:middle" width='167'><p>Please provide SKU.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9218</p></td><td style="vertical-align:middle" width='167'><p>Qty can't be blank.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9219</p></td><td style="vertical-align:middle" width='167'><p>Invalid Qty.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>0220</p></td><td style="vertical-align:middle" width='167'><p>Qty can't be in decimals.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9221</p></td><td style="vertical-align:middle" width='167'><p>Invalid SKU Details.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9222</p></td><td style="vertical-align:middle" width='167'><p>Error in parsing request data</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9223</p></td><td style="vertical-align:middle" width='167'><p>Invalid order status to continue.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9224</p></td><td style="vertical-align:middle" width='167'><p>STO details not found for update</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9225</p></td><td style="vertical-align:middle" width='167'><p>STO already cancelled.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9226</p></td><td style="vertical-align:middle" width='167'><p>Please provide valid cancellation reason.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9227</p></td><td style="vertical-align:middle" width='167'><p>From Date and To Date is given, source location is mandatory in this case.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9229</p></td><td style="vertical-align:middle" width='167'><p>Order date is mandatory.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9230</p></td><td style="vertical-align:middle" width='167'><p>Order date format is not correct should be (dd/MM/yyyy HH:mm:ss) in IST timezone.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9231</p></td><td style="vertical-align:middle" width='167'><p>Maximum limit exceeded(Max. </p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9232</p></td><td style="vertical-align:middle" width='167'><p>orders allowed.)</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9234</p></td><td style="vertical-align:middle" width='167'><p>STO No. already used</p></td></tr></table>
          schema:
            $ref: '#/definitions/STOCreate2'
