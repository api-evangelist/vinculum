      responses:
        200:
          description: <table border='1'width='672'>  <h1  style="color:#FFFF00;">API Generic Error Codes</h1><tbody><tr align="center"><td style="vertical-align:middle" width='167'><p><strong>Response Code </strong></p></td><td style="vertical-align:middle" colspan='2' width='171'><p><strong> Response Message </strong></p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>9</p></td><td style="vertical-align:middle" width='167'><p>Sku Defaults Not set in gCodelookup, needed atleast 8 defaults as Hierarchy,TaxCategory,Classification,Source,AttributeSet,Vendor,Status,Rotation,UOM</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>701</p></td><td style="vertical-align:middle" width='167'><p>Maximum Limit Exceeded(100 SKUs Max)</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1001</p></td><td style="vertical-align:middle" width='167'><p>Specified Vendor [" ** "] not found in the system.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1004</p></td><td style="vertical-align:middle" width='167'><p>Size Not Found in Configurations.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1014</p></td><td style="vertical-align:middle" width='167'><p>Invalid Sku Classification **</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1015</p></td><td style="vertical-align:middle" width='167'><p>Parent Sku does not exist in the system</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1016</p></td><td style="vertical-align:middle" width='167'><p>Parent Sku is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1017</p></td><td style="vertical-align:middle" width='167'><p>Style Attribute is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1018</p></td><td style="vertical-align:middle" width='167'><p>Size is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1019</p></td><td style="vertical-align:middle" width='167'><p>Colour is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1020</p></td><td style="vertical-align:middle" width='167'><p>Size|Colour is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1020</p></td><td style="vertical-align:middle" width='167'><p>Size is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1021</p></td><td style="vertical-align:middle" width='167'><p>Colour is Mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1022</p></td><td style="vertical-align:middle" width='167'><p>Invalid Style Attribute</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1024</p></td><td style="vertical-align:middle" width='167'><p>Invalid isUniqueBarcode</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1025</p></td><td style="vertical-align:middle" width='167'><p>Cant change classification for SKU</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1035</p></td><td style="vertical-align:middle" width='167'><p>Invalid ClientID  **</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>31003</p></td><td style="vertical-align:middle" width='167'><p>Invalid SKU Classification</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>31004</p></td><td style="vertical-align:middle" width='167'><p>Invalid SKU Source imported</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>31005</p></td><td style="vertical-align:middle" width='167'><p>Invalid Size imported</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>31006</p></td><td style="vertical-align:middle" width='167'><p>Invalid Color imported</p></td></tr></tbody></table>  <table width='672'><tbody><tr><td style="vertical-align:middle" colspan=5> <b>Case 1- For Single SKU Submitted<br/> {<br/> &nbsp;"responsecode":"0",</br>&nbsp;"responseMessage":"Success"<br/>&nbsp;"requestStatus":<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"uniqueKey":"TEST1234",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"requestKey":"TEST1234",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"outputKey":null,<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"status":"Success",<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"errorDesc":null<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}<br/><br/>}</b><br/><br/> <b>Case 2- For Multiple SKU Submitted<br/>{<br/> &nbsp;"responseCode":0,</br>&nbsp;"responseMessage":"Success",<br/>&nbsp;"requestId":"30ee612f5ccd425cb37781a262592807"<br/>&nbsp;}</b><br/><br/></tbody></table>
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                RequestBody:
                  type: string
                  description: '<table class="table-style-three"><tbody><tr><tr align="center"><td style="vertical-align:middle" width=''100''><strong>Field Name </strong></td><td style="vertical-align:middle" width=''100''><strong>Data Type </strong></td><td style="vertical-align:middle" width=''100''><strong>Mandatory </strong></td><td style="vertical-align:middle" width=''300''><strong>Description </strong></td></tr><tr align="center"><td style="vertical-align:middle">skuCode</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">Unique identifier for the SKU</td></tr><tr align="center"><td style="vertical-align:middle">fnvtype</td><td style="vertical-align:middle">Varchar(10)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Repack,crossdock (FnV type is only mandatory when sku classification is FnV).</td></tr><tr align="center"><td style="vertical-align:middle">skuName</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">Descriptive name of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">classification</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Possible Values Normal,Style,Variant,BOM,fnV (default Normal)</td></tr><tr align="center"><td style="vertical-align:middle">bomType</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Mandatory when Classification is BOM else NonMandatory</td></tr><tr align="center"><td style="vertical-align:middle">bundledArticleList</td><td style="vertical-align:middle">Array</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Mandatory when Classification is BOM else NonMandatory</td></tr><tr align="center"><td style="vertical-align:middle">styleAttribute</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Mandatory when Classification is Style, Possible Values Size ,Colour, Size|Colour</td></tr><tr align="center"><td style="vertical-align:middle">parentSKU</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Mandatory when Classification is Variant</td></tr><tr align="center"><td style="vertical-align:middle">skuGrade</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">quality/condition/category grade attached to a SKU</td></tr><tr align="center"><td style="vertical-align:middle">gradableSku</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Gradable Sku Code</td></tr><tr align="center"><td style="vertical-align:middle">minimumTransferQty</td><td style="vertical-align:middle">Decimal(10,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Minimum quantity of the SKU that needs to be present in an STO</td></tr><tr align="center"><td style="vertical-align:middle">transferUnitFactor</td><td style="vertical-align:middle">Decimal(10,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">The multiple in which the SKU may be added to an STO</td></tr><tr align="center"><td style="vertical-align:middle">detailDesc</td><td style="vertical-align:middle">Varchar(300)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">A detailed description of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">length</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">The length of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">width</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">The Width of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">height</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">The Height of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">weight</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">The Weight of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">size</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">If not exists system will create size automatically</td></tr><tr align="center"><td style="vertical-align:middle">color</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">If not exists system will create color automatically</td></tr><tr align="center"><td style="vertical-align:middle">brand</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">If not exists system will create brand automatically</td></tr><tr align="center"><td style="vertical-align:middle">mrp</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">MRP/MSRP of the SKU</td></tr><tr align="center"><td style="vertical-align:middle">salePrice</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">Selling Price of SKU</td></tr><tr align="center"><td style="vertical-align:middle">Vendorcode</td><td style="vertical-align:middle">Varchar(10)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">Unique code assigned to a vendor supplying the SKU</td></tr><tr align="center"><td style="vertical-align:middle">vendorName</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Name of the vendor supplying the SKU</td></tr><tr align="center"><td style="vertical-align:middle">baseCost</td><td style="vertical-align:middle">Decimal(7,3)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">Cost price of the SKU before tax and other charges</td></tr><tr align="center"><td style="vertical-align:middle">taxCategory</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">The applicable tax category for the SKU</td></tr><tr align="center"><td style="vertical-align:middle">isActive</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory*</td><td style="vertical-align:middle">yes/no, default Yes</td></tr><tr align="center"><td style="vertical-align:middle">lottableValidation</td><td style="vertical-align:middle">Varchar(10)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">If not passed API will pick default lottable validation from masters</td></tr><tr align="center"><td style="vertical-align:middle">pdpURL</td><td style="vertical-align:middle">Varchar(250)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Product Page URL</td></tr><tr align="center"><td style="vertical-align:middle">serialTrackingRequired</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">yes/no</td></tr><tr align="center"><td style="vertical-align:middle">serialCount</td><td style="vertical-align:middle">smallint(6)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Count of IMEI no in case serial tracking is enabled. Max value can be 3, default is 1,Possible values are 1 ,2,3.</td></tr><tr align="center"><td style="vertical-align:middle">isSaleable</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">yes/no, default Yes</td></tr><tr align="center"><td style="vertical-align:middle">udf1</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf2</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf3</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf4</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf5</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle" >udf6</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle" >udf7</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle" >udf8</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle" >udf9</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle" >udf10</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">imageURL</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Image URL</td></tr><tr align="center"><td style="vertical-align:middle">category1</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory as per Merch Hierarchy config </td><tr align="center"><td style="vertical-align:middle">category2</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory as per Merch Hierarchy config </td></tr><tr align="center"><td style="vertical-align:middle">category3</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory as per Merch Hierarchy config </td></tr><tr align="center"><td style="vertical-align:middle">category4</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory as per Merch Hierarchy config </td></tr><tr align="center"><td style="vertical-align:middle">category5</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory as per Merchandise Hierarchy config (if level 5 is configured then all 5 category is mandatory)</td></tr><tr align="center"><td style="vertical-align:middle">lasthieracyCode</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">description of last category. If multiple category at last leaf then latest will be considered ) </td></tr><tr align="center"><td style="vertical-align:middle">isBackOrder</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Yes/no</td></tr><tr align="center"><td style="vertical-align:middle">backOrderQty</td><td style="vertical-align:middle">decimal(10,3)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory if isBackorder is passed as yes</td></tr><tr align="center"><td style="vertical-align:middle">vendorSkuCode</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Seller SKU code if any</td></tr><tr align="center"><td style="vertical-align:middle">upc_ean</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Product Barcode</td></tr><tr align="center"><td style="vertical-align:middle">barcodeType</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Barcode Type</td></tr><tr align="center"><td style="vertical-align:middle">material</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle"></td></tr><tr align="center"><td style="vertical-align:middle">isUniqueBarcode</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">1. If this flag is passed as yes then at the time of inbound/adjustment system will generate unique barcode of that SKU.<br/>2. All transaction will be done on the basic of unique barcode only</td></tr><tr align="center"><td style="vertical-align:middle">shippingCharges</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Shipping charges</td></tr><tr align="center"><td style="vertical-align:middle">pickingInstruction</td><td style="vertical-align:middle">Varchar(500)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Picking Instructions configured in Other Masters.</td></tr><tr align="center"><td style="vertical-align:middle">shipingInstruction</td><td style="vertical-align:middle">Varchar(500)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Shipping instructions configured in Other Masters.</td></tr><tr align="center"><td style="vertical-align:middle">careIntructions</td><td style="vertical-align:middle">Varchar(500)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Care Instructions, if any</td></tr><tr align="center"><td style="vertical-align:middle">budf1</td><td style="vertical-align:middle">Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">budf2</td><td style="vertical-align:middle">Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">budf3</td><td style="vertical-align:middle">Varchar(2000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr