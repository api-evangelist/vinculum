ngInstruction</td> <td style="vertical-align:middle">Varchar(500)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Shipping instructions configured in Other Masters.</td> </tr> <tr align="center"> <td style="vertical-align:middle">hieracyCode</td> <td style="vertical-align:middle">Varchar(100)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Merchandising hierarchy code(Only last heirarchy code can be used)</td> </tr><tr align="center"> <td style="vertical-align:middle">hierarcyString</td> <td style="vertical-align:middle">Varchar(100)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Merchandising hierarchy description(Only last heirarchy code can be used)</td> </tr> <tr align="center"> <td style="vertical-align:middle">serialCount</td> <td style="vertical-align:middle">Integer</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Count of IMEI no in case serial tracking is enabled. Max value can be 3, default is 1,Possible values are 1 ,2,3.</td> </tr> <tr align="center"> <td style="vertical-align:middle">isSKUOnVirtualQty</td> <td style="vertical-align:middle">Varchar(3)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">yes/no</td> </tr> <tr align="center"> <td style="vertical-align:middle">virtualQty</td> <td style="vertical-align:middle">Integer(10)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Virtual Quantity of Sku , for SKU type BOM</td> </tr> <tr align="center"> <td style="vertical-align:middle">vendorSkuCode</td> <td style="vertical-align:middle">Varchar(50)</td> <td style="vertical-align:middle">Optional</td> <td style="vertical-align:middle">Seller SKU code if any</td> </tr> <tr align="center"> <td style="vertical-align:middle">upc_ean</td> <td style="vertical-align:middle">Varchar(100)</td> <td style="vertical-align:middle">Optional