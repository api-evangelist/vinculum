        description: <table class="table-style-three"><tbody><tr align="center"><td style="vertical-align:middle" width='100'><strong>Field Name </strong></td><td style="vertical-align:middle" width='100'><strong>Data Type </strong></td><td style="vertical-align:middle" width='100'><strong>Mandatory </strong></td><td style="vertical-align:middle" width='300'><strong>Description </strong></td></tr><tr align="center"><td style="vertical-align:middle">channelName</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Name of channel for identification</td></tr><tr align="center"><td style="vertical-align:middle">channelCode</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">System Auto generated Channel Code i.e. M01, N01, N99 etc</td></tr><tr align="center"><td style="vertical-align:middle">status</td><td style="vertical-align:middle">char(1)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">1 for Active and 0 for In-active channel</td></tr><tr align="center"><td style="vertical-align:middle">orderSourceWH</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Should be a valid location code created in ERP</td></tr><tr align="center"><td style="vertical-align:middle">linkSkuStoAllLocation</td><td style="vertical-align:middle">Varchar(3)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Enable Link to Location for the channel, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">channelTypeName</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Name of the Marketplace Name created in System</td></tr><tr align="center"><td style="vertical-align:middle">orderSyncEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Used to enable the order Pull interface of the channel, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">shippingBy</td><td style="vertical-align:middle">tinyint(6)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">1 is for Marketplace and 2 is for Self Ship</td></tr><tr align="center"><td style="vertical-align:middle">useShippingLabel</td><td style="vertical-align:middle">smallint(6)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Use Marketplace Shipping label or Not, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">useInvoice</td><td style="vertical-align:middle">smallint(6)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Use Marketplace Invoice label or Not</td></tr><tr align="center"><td style="vertical-align:middle">skuPullEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Pull the SKUs from Marketplace or Not</td></tr><tr align="center"><td style="vertical-align:middle">invPerc</td><td style="vertical-align:middle">Decimal(10,3)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Always Numeric, define the percentage of inventory to be synced to Marketplace/We bshop</td></tr><tr align="center"><td style="vertical-align:middle">invSyncEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Enable the Inventory Sync of that channel to sync the inventory to Marketplace/We bshop, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">returnPullEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Enable the return Sync of that channel to sync, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">prePackEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Enable the Prefetch Label Feature of that channel to pull the ship label after picklist generation automatically, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">vendorPullEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Enable the Vendor Pull Feature, Not applicable to Marketplaces, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">invSyncMethod</td><td style="vertical-align:middle">Varchar(1)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">1 is for all locations, and 2 is for custom locations defined in designatedWH</td></tr><tr align="center"><td style="vertical-align:middle">merchantId</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">apiUrl</td><td style="vertical-align:middle">Varchar(400)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">apiKey</td><td style="vertical-align:middle">Varchar(1000)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">apiPassword</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">userName</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">password</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">authToken</td><td style="vertical-align:middle">Varchar(100)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">storeId</td><td style="vertical-align:middle">Varchar(10)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Channel Specific credentials</td></tr><tr align="center"><td style="vertical-align:middle">isConfigured</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Channel Specific credentials, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">channelSkuPrefix</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Prefix to to added to SKU Code pulled from Marketplace</td></tr><tr align="center"><td style="vertical-align:middle">channelSkuSuffix</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Suffix to to added to SKU Code pulled from Marketplace</td></tr><tr align="center"><td style="vertical-align:middle">vendorId</td><td style="vertical-align:middle">Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">VendorId to be linked to the channel</td></tr><tr align="center"><td style="vertical-align:middle">udf1</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf2</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf3</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf4</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">udf5</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">User Defined Field</td></tr><tr align="center"><td style="vertical-align:middle">jitVendorEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">To enable the order routing on the basis of JIT vendor, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">invSyncMinBuffer</td><td style="vertical-align:middle">Varchar(11)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Inventory Sync Buffer for that channel</td></tr><tr align="center"><td style="vertical-align:middle">enableBackOrder</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Enable the Back Order inventory, Applicable for JIT channels only, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">enableInventoryRecon</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">To Enable the inventory Reconciliation</td></tr><tr align="center"><td style="vertical-align:middle">channelSLA</td><td style="vertical-align:middle">Integer</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Channel SLA to be Set</td></tr><tr align="center"><td style="vertical-align:middle">rtsMode</td><td style="vertical-align:middle">Varchar(1)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">1 is for Marking ready to Ship to Marketplaces at Manifest and 2 is for Marking Ready to Ship on Pack (Applicable to specific MPs)</td></tr><tr align="center"><td style="vertical-align:middle">designatedWHforInventory</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Valid Location code created in ERP for inventory sync and applicable if invsyncmethod= 2</td></tr><tr align="center"><td style="vertical-align:middle">maxAllowedInv</td><td style="vertical-align:middle">Integer</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Max Allowed inventory push for the SKUs on that channel</td></tr><tr align="center"><td style="vertical-align:middle">customerCode</td><td style="vertical-align:middle">Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Customer Code to be linked to channel</td></tr><tr align="center"><td style="vertical-align:middle">skuCreateMode</td><td style="vertical-align:middle">Varchar(1)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">C is for creating the SKU pulled from Marketplace and M is for Moderate i.e. Linking the MP Sku to Vin- eRetail SKU</td></tr><tr align="center"><td style="vertical-align:middle">eachQtyPerLine</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Spilit the orderline quantity to 1 quantity per line of that SKU, Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">internationalInvoice</td><td style="vertical-align:middle">Varchar(25)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Name of the international Invoice Report Name to be configure to Channel</td></tr><tr align="center"><td style="vertical-align:middle">domasticlInvoice</td><td style="vertical-align:middle">Varchar(25)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Name of the domestic Invoice Report Name to be configure to Channel</td></tr><tr align="center"><td style="vertical-align:middle">orderPullFromDate</td><td style="vertical-align:middle">Datetime</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">DateTime from which the order needs to be pulled</td></tr><tr align="center"><td style="vertical-align:middle">taxExclusive</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Always No, Should be used as Yes If the orders pushed to the channel have Unit Price exclusive of Tax</td></tr><tr align="center"><td style="vertical-align:middle">priceSyncEnabled</td><td style="vertical-align:middle">Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Enable the Price Sync(Applicableto specific Channels only), Possible values are Yes/No</td></tr><tr align="center"><td style="vertical-align:middle">sendLocWiseInv</td><td style="vertical-align:middle">tinyint(6)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Default is No and this is applicable to Webshops supporting multi location inventory Push</td></tr><tr align="center"><td style="vertical-align:middle">shippingLabel</td><td style="vertical-align:middle">Varchar(25)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Name of the Shipping label report to be set on channel Orders</td></tr><tr align="center"><td style="vertical-align:middle" colspan=4 ><b>billToParty</b></td></tr><tr align="center"><td style="vertical-align:middle">billPartyCode</td><td style="vertical-align:middle">Varchar(11)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">AutoGenerated BilltoPartyCode</td></tr><tr align="center"><td style="vertical-align:middle">address1</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Address 1 of the party</td></tr><tr align="center"><td style="vertical-align:middle">address2</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Address 2 of the party</td></tr><tr align="center"><td style="vertical-align:middle">billPartyName</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Name of the Bill to Party</td></tr><tr align="center"><td style="vertical-align:middle">status</td><td style="vertical-align:middle">Varchar(1)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">1 is for active and 2 for In- active</td></tr><tr align="center"><td style="vertical-align:middle">city</td><td style="vertical-align:middle">Varchar(255)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">City Name</td></tr><tr align="center"><td style="vertical-align:middle">country</td><td style="vertical-align:middle">Varchar(50)</td><td style="vertical-align:middle">Mandatory</td><td style="