tyle="vertical-align:middle" width='167'><p>InvSyncMinBuffer can only be numeric. It cannot be more than 11 digits.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5110</p></td><td style="vertical-align:middle" width='167'><p>orderSyncEnabled is a mandatory field. It cannot be null or blank. It can either be Yes or No</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5112</p></td><td style="vertical-align:middle" width='167'><p>orderSourceWH cannot be more than 10 characters.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5113</p></td><td style="vertical-align:middle" width='167'><p>billPartyCode should be numeric.It cannot be more than 11 digits long.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5114</p></td><td style="vertical-align:middle" width='167'><p>customerCode should be numeric.It cannot be more than 20 digits long.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5115</p></td><td style="vertical-align:middle" width='167'><p>emailId under Bill to Party passed is not in correct format.</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>5116</p></td><td style="vertical-align:middle" width='167'><p>tinNo under Bill to Party Is A Mandatory Field. It Cannt Be Left Null Or Blank</p></td></tr></tbody></table>
