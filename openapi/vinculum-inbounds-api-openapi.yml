 (poCode / asnCode/inboundCode/returnCode/stoNo) or Date filter mandatory</td></tr><tr align="center"><td style="vertical-align:middle">pageNumber</td><td style="vertical-align:middle">Integer</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Default 1</td></tr><tr align="center"><td style="vertical-align:middle">inboundcode</td><td style="vertical-align:middle">Varchar(12)</td><td style="vertical-align:middle">Conditional*</td><td style="vertical-align:middle">Either (poCode / asnCode/inboundCode/returnCode/stoNo) or Date filter mandatory</td></tr><tr align="center"><td style="vertical-align:middle">returnCode</td><td style="vertical-align:middle">Varchar(12)</td><td style="vertical-align:middle">Conditional*</td><td style="vertical-align:middle">Either (poCode / asnCode/inboundCode/returnCode/stoNo) or Date filter mandatory</td></tr><tr align="center"><td style="vertical-align:middle">vendor_code</td><td style="vertical-align:middle">Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Vendor Code(If details by date filter)</td></tr><tr align="center"><td style="vertical-align:middle">filterBy</td><td style="vertical-align:middle">Varchar(1)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">get PO on the basis of updation or creation date Default:GRNdate, Possible values are 1 (update date),2(create date)</td></tr><tr align="center"><td style="vertical-align:middle">inbType</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Inbound Type, Defined in Codelkup with lkupcode 'INBTYPE'.</td></tr><tr><td  colspan=5> <b>Case 1-Request by poCode</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"DEL38206",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp"filterBy":"1"</br>&nbsp;}</b><br/><br/><br/> <b>Case 2-Request by inboundCode</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"BTD000000000",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":""<br/>&nbsp;}</b><br/><br/><br/> <b>Case 3-Request by date range filter</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"CHE",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"10/12/2017 00:00:00",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"17/12/2017 00:00:00",</br>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":""<br/>&nbsp;}</b> </b><br/><br/><br/> <b>Case 4-Request by asnCode</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"ASN001",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":"&nbsp;<br/>}</b><br/><br/><br/> <b>Case 5-Request by returnCode</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"CHE1234",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":""<br/>&nbsp;}</b><br/><br/><br/> <b>Case 6-Request by stoNo</b><br/> <b>{<br/> &nbsp;&nbsp;&nbsp;&nbsp;"poCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"asnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"stoNo":"CHE168458",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inboundcode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"returnCode":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"delloc":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"fromDate":"",<br/>&nbsp;&nbsp;&nbsp;&nbsp;"toDate":"",</br>&nbsp;&nbsp;&nbsp;&nbsp;"pageNumber":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"vendor_code":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"inbType":"1",</br>&nbsp;&nbsp;&nbsp;&nbsp;"filterBy":""<br/>&nbsp;}</b><br/><br/><br/> <br/></td></tr></tbody></table><p>&nbsp;</p><br/>
        required: true
