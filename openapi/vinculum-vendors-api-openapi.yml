      summary: API For Creating Vendor(Hit Quota 40/5 min)
      responses:
        200:
          description: <table border='1'width='672'>  <h1  style="color:#FFFF00;">API Generic Error Codes</h1><tbody><tr align="center"><td style="vertical-align:middle" width='167'><p><strong>Response Code </strong></p></td><td style="vertical-align:middle" colspan='2' width='171'><p><strong> Response Message </strong></p></td></tr></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1001</p></td><td style="vertical-align:middle" width='167'><p>Vendor Creation Error while processing</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1002</p></td><td style="vertical-align:middle" width='167'><p>Ext Vendor Code is mandatory</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1003</p></td><td style="vertical-align:middle" width='167'><p>Ship Phone length should not be greater than 20 characters</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>1004</p></td><td style="vertical-align:middle" width='167'><p>Ship Email length should not be greater than 50 characters</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>E10117</p></td><td style="vertical-align:middle" width='167'><p> Please Enter Valid TOMail {0}</p></td></tr><tr align="center"><td style="vertical-align:middle" width='167'><p>E10118</p></td><td style="vertical-align:middle" width='167'><p>Please Enter Valid CCMail {0}</p></td></tr></tbody></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreateResponse'
      requestBody:
