ddle">Varchar(100)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">As per the Masters</td></tr><tr align="center"><td style="vertical-align:middle">vendorCurrency</td><td style="vertical-align:middle">Varchar(10)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">ISO currency code</td></tr><tr align="center"><td style="vertical-align:middle">vendorType</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are Outright Purchase ,Marketplace,JIT(default Outright Purcahse if not passing)</td></tr><tr align="center"><td style="vertical-align:middle">defaultDeliveryMode</td><td style="vertical-align:middle">Varchar(200)</td><td style="vertical-align:middle">*Conditional</td><td style="vertical-align:middle">Possible Values Drop Ship, Ship via FC, Vendor Self Delivery, Defined in Codelkup with lkupcode 'DLVRMOD'.Mandatory when vendorType is of type Marketplace.</br>This is mandatory when vendorType is of type Marketplace.</td></tr><tr align="center"><td style="vertical-align:middle">returnDays</td><td style="vertical-align:middle">Integer</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Return acceptance days for the Vendor</td></tr><tr align="center"><td style="vertical-align:middle">costDerivative</td><td style="vertical-align:middle">Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are Gross, Net</td></tr><tr align="center">  <td style="vertical-align:middle" >shipAddress1</td>  <td style="vertical-align:middle" >Varchar(250)</td>  <td style="vertical-align:middle" >Mandatory</td>  <td style="vertical-align:middle" >line 1 of vendor's shipping address</td></tr><tr align="center"><td style="vertical-align:middle" >shipAddress2</td><td style="vertical-align:middle" >Varchar(250)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >line 2 of vendor's shipping address</td></tr><tr align="center"><td style="vertical-align:middle" >shipAddress3</td><td style="vertical-align:middle" >Varchar(250)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >line 3 of vendor's shipping address</td></tr><tr align="center"><td style="vertical-align:middle" >shipContactPerson</td><td style="vertical-align:middle" >Varchar(200)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Contact name of person at Shipping Address</td></tr><tr align="center"><td style="vertical-align:middle" >shipPhone</td><td style="vertical-align:middle" >Varchar(20)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Contact No. of Vendor's Shipping address</td></tr><tr align="center"><td style="vertical-align:middle" >shipEmail</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Mandatory</td><td style="vertical-align:middle">Email Id of Vendor's Shipping address</td></tr><tr align="center"><td style="vertical-align:middle" >shipCity</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >City Name of Vendor's Shipping adress</td></tr><tr align="center"><td style="vertical-align:middle" >shipState</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >State Name of Vendor's Shipping Address</td></tr><tr align="center"><td style="vertical-align:middle" >shipCountry</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Country Name of vendor's Shipping Address</td></tr><tr align="center"><td style="vertical-align:middle" >shipPincode</td><td style="vertical-align:middle" >Varchar(10)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Pincode of Vendor's Shipping Address</td></tr><tr align="center"><td style="vertical-align:middle" >latitude</td><td style="vertical-align:middle" >Varchar(100)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Latitudes range from -90 to 90, e. g. 17.572375290155</td></tr><tr align="center"><td style="vertical-align:middle" >longitude</td><td style="vertical-align:middle" >Varchar(100)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >Longitudes range from -180 to 80, e. g. -179.572375290155</td></tr><tr align="center"><td style="vertical-align:middle" >billContactPerson</td><td style="vertical-align:middle" >Varchar(255)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Contact name of person at billing Address</td></tr><tr align="center"><td style="vertical-align:middle" >billAddress1</td><td style="vertical-align:middle" >Varchar(250)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >line 1 of vendor's billing address</td></tr><tr align="center"><td style="vertical-align:middle" >billAddress2</td><td style="vertical-align:middle" >Varchar(250)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >line 2 of vendor's billing address</td></tr><tr align="center"><td style="vertical-align:middle" >billAddress3</td><td style="vertical-align:middle" >Varchar(250)</td><td style="vertical-align:middle" >Optional</td><td style="vertical-align:middle" >line 3 of vendor's billing address</td></tr><tr align="center"><td style="vertical-align:middle" >billPhone</td><td style="vertical-align:middle" >Varchar(255)</td><td style="vertical-align:middle" >Mandatory</td><td style="vertical-align:middle" >Contact No. of Vendor's billing address</td></tr><tr align="center"><td style="vertical-align:middle" >billEmail</td>