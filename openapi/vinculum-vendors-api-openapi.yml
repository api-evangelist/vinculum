nal</td><td style="vertical-align:middle">minOrderValue</td></tr><tr align="center"><td style="vertical-align:middle" >isTaxExempted</td><td style="vertical-align:middle" >Varchar(12)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">isTaxExempted</td></tr><tr align="center"><td style="vertical-align:middle" >glCode</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">GLCode</td></tr><tr align="center"><td style="vertical-align:middle" >isCostBasedOnMargin</td><td style="vertical-align:middle" >Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">isCostBasedOnMargin</td></tr><tr align="center"><td style="vertical-align:middle" >gstinno</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">gstinno of Vendor</td></tr><tr align="center"><td style="vertical-align:middle" >endEffDate</td><td style="vertical-align:middle" >Varchar(12)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">PAN No. of Vendor</td></tr><tr align="center"><td style="vertical-align:middle" >returnFlag</td><td style="vertical-align:middle" >tinyint(1)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are 1 and 0</td></tr><tr align="center"><td style="vertical-align:middle" >isAutoPO</td><td style="vertical-align:middle" >Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are True or false</td></tr><tr align="center"><td style="vertical-align:middle" >licenseNo</td><td style="vertical-align:middle" >Varchar(20)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">license No. of Vendor</td></tr><tr align="center"><td style="vertical-align:middle" >otpValidation</td><td style="vertical-ali