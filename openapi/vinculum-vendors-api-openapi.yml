-align:middle">Mandatory</td><td style="vertical-align:middle">tin of vendor</td></tr><tr align="center"><td style="vertical-align:middle" >digitalsignatureurl</td><td style="vertical-align:middle" >Varchar(300)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">digital signature Url of vendor</td></tr><tr align="center"><td style="vertical-align:middle" >digitalsignaturebytestream</td><td style="vertical-align:middle" >Byte Array</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle"></td></tr><tr align="center"><td style="vertical-align:middle" >linkToStore</td><td style="vertical-align:middle" >Varchar</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">1 or more than 1 store can be linked comma seprated</td></tr><tr align="center"><td style="vertical-align:middle" >locCode</td><td style="vertical-align:middle" >Varchar(5)</td><td style="vertical-align:middle">Conditional</td><td style="vertical-align:middle">Mandatory to be filled in case VendorType = "JIT" else non-mandatory.</td></tr><tr align="center"><td style="vertical-align:middle" >byPassSKUVendorLink</td><td style="vertical-align:middle" >Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are YES or NO</td></tr><tr align="center"><td style="vertical-align:middle" >invoiceNoBy</td><td style="vertical-align:middle" >Varchar(50)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are market place  or self</td></tr><tr align="center"><td style="vertical-align:middle" >allowHopping</td><td style="vertical-align:middle" >Varchar(5)</td><td style="vertical-align:middle">Optional</td><td style="vertical-align:middle">Possible values are YES or NO</td></tr><tr align="center"><td style="vertical-align:middle" >sla</td><td style="vertical-align:middle" >smallint</td><td style="vertical-align:middle">Optional</td